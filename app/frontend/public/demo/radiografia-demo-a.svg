    <g id="knee">
      <path d="M85 0 C94 68 95 123 85 180 C80 210 49 226 43 258 C39 281 48 298 70 302 C96 308 116 295 124 281 C134 299 159 307 180 297 C200 288 198 264 187 245 C169 215 147 209 147 177 C147 112 154 61 159 0Z" fill="url(#bone)" stroke="#d1dbe0" stroke-opacity=".55" stroke-width="3"/>
