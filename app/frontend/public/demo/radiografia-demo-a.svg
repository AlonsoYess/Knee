  <title id="title">Imagen A: esquema bilateral sintético</title>
  <desc id="desc">Ilustración vectorial ficticia para diseñar la interfaz. No contiene una radiografía ni datos de pacientes. Derecha del paciente a la izquierda del esquema; izquierda a la derecha.</desc>
