      <path d="M202 354 C222 344 232 355 226 379 L204 550 L184 550 L195 407Z" fill="#8d9ca6" fill-opacity=".4" stroke="#c5d0d6" stroke-opacity=".4" stroke-width="2"/>
      <path d="M77 243 Q95 257 87 282 M149 246 Q164 259 161 282 M81 337 Q128 345 175 335" fill="none" stroke="#e1e8eb" stroke-opacity=".35" stroke-width="3"/>
    </g>
  </defs>
