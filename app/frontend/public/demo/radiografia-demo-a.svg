  <g font-family="Segoe UI,Arial,sans-serif" fill="#b9cbd2"><text x="38" y="42" font-size="17" letter-spacing="2">KNEEOAI · IMAGEN A</text><text x="922" y="42" text-anchor="end" font-size="14">DEMO</text></g>
  <g transform="translate(220 75)"><use href="#knee"/></g>
  <g transform="translate(505 75)"><use href="#knee"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="340" y="666" fill="#d6e6e9" font-size="17">Derecha del paciente</text><text x="625" y="666" fill="#d6e6e9" font-size="17">Izquierda del paciente</text></g>
  <rect x="246" y="356" width="468" height="46" rx="8" fill="#14242d" fill-opacity=".88"/>
