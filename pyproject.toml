[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-oai-thesis"
version = "0.1.0"
description = "Reproducible preparation and evaluation for knee OA progression research"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "pydicom>=2.4,<4",
]

[project.scripts]
knee-audit = "knee.audit:main"
knee-dicom-audit = "knee.dicom_audit:main"
knee-acquisition-inventory = "knee.acquisition_inventory:main"
knee-selective-download = "knee.selective_download:main"
knee-bilateral-pilot = "knee.bilateral_separation:main"
knee-bilateral-close = "knee.bilateral_review:main"
knee-joint-pilot = "knee.joint_localization:main"
knee-run-record = "knee.experiment:main"
knee-change-check = "knee.change_control:main"

[tool.setuptools.packages.find]
where = ["src"]

