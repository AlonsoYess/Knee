[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-oai-thesis"
version = "0.1.0"
description = "Reproducible preparation and evaluation for knee OA progression research"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
knee-audit = "knee.audit:main"
knee-run-record = "knee.experiment:main"
knee-change-check = "knee.change_control:main"

[tool.setuptools.packages.find]
where = ["src"]

