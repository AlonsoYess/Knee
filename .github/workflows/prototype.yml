name: Prototype checks

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/prototype.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: app/frontend/.node-version
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.lock
      - name: Install isolated API dependencies
        working-directory: app/backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
      - name: Test API with temporary fictional databases
        working-directory: app/backend
        run: .venv/bin/python -m pytest tests -q
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:contracts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa:unit
      - run: npm run test:e2e
        env:
          CI: 'true'
      - run: npm run test:pwa
        env:
          CI: 'true'
